<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pokemon Drop Assistant</title>
  <!--
    MINI APP TELEGRAM de Pokemon Drop Assistant (2026-10-20). Page FIXE, sans serveur et sans aucune donnée : l'extension de chaque personne met son tableau (demandes
    d'achat, offres achetables à son prix, suivis) dans le LIEN du bouton « Mon tableau » (partie après #, qui ne quitte jamais le téléphone : elle n'est envoyée à aucun
    serveur). Les choix (Acheter, Refuser, Pause) repartent au bot de la personne par Telegram (sendData), que son extension lit. Aucun jeton, aucun appel réseau à part
    le script officiel de Telegram et les photos des produits.
  -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff); --text: var(--tg-theme-text-color, #1a1c22); --hint: var(--tg-theme-hint-color, #7a808c);
      --card: var(--tg-theme-secondary-bg-color, #f2f3f6); --link: var(--tg-theme-link-color, #2a7de1); --btn: var(--tg-theme-button-color, #2a7de1);
      --btn-text: var(--tg-theme-button-text-color, #ffffff); --ok: #1f9d55; --no: #d64545; --warn: #c27c0e;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
    main { padding: 14px 14px 90px; max-width: 640px; margin: 0 auto; }
    header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    header .logo { width: 38px; height: 38px; border-radius: 12px; background: linear-gradient(135deg, #ffcb05, #e3350d); display: grid; place-items: center; font-size: 20px; }
    header h1 { font-size: 17px; margin: 0; }
    header .sub { font-size: 12px; color: var(--hint); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
    .chip { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--card); }
    .chip.ok { color: var(--ok); } .chip.warn { color: var(--warn); } .chip.no { color: var(--no); }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--hint); margin: 18px 4px 8px; }
    .card { background: var(--card); border-radius: 14px; padding: 12px; margin-bottom: 10px; }
    .req .title { font-weight: 700; margin-bottom: 2px; }
    .req .meta { color: var(--hint); font-size: 13px; margin-bottom: 10px; }
    .row { display: flex; gap: 8px; }
    button { font: inherit; font-weight: 700; border: 0; border-radius: 12px; padding: 11px 12px; flex: 1; cursor: pointer; }
    button.buy { background: var(--ok); color: #fff; } button.no { background: transparent; color: var(--no); border: 2px solid var(--no); }
    button.ghost { background: var(--card); color: var(--text); }
    .offer { display: flex; gap: 12px; align-items: center; text-decoration: none; color: inherit; }
    .offer img, .offer .ph { width: 64px; height: 64px; border-radius: 10px; object-fit: contain; background: #fff; flex: none; }
    .offer .ph { display: grid; place-items: center; font-size: 26px; }
    .offer .t { font-weight: 600; font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .offer .p { font-weight: 800; font-size: 16px; margin-top: 2px; }
    .offer .m { font-size: 12px; color: var(--hint); }
    .pre { font-size: 11px; font-weight: 700; color: var(--warn); margin-left: 6px; }
    .empty { color: var(--hint); text-align: center; padding: 18px 8px; }
    .stats { display: flex; gap: 10px; }
    .stat { flex: 1; text-align: center; }
    .stat b { display: block; font-size: 22px; }
    .stat span { font-size: 12px; color: var(--hint); }
    .foot { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--card); }
    .foot .row { max-width: 640px; margin: 0 auto; }
    .old { color: var(--warn); font-size: 12px; text-align: center; margin: 4px 0 10px; }
  </style>
</head>
<body>
  <main id="app"><p class="empty">Chargement…</p></main>
  <div class="foot" id="foot" hidden><div class="row"><button class="ghost" id="pause"></button></div></div>
  <script>
    "use strict";
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) { tg.ready(); tg.expand(); }
    const app = document.getElementById("app");
    const el = (tag, attrs, ...children) => {
      const node = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs || {})) { if (v === null || v === undefined || v === false) continue; if (k === "class") node.className = v; else if (k.startsWith("on")) node.addEventListener(k.slice(2), v); else node.setAttribute(k, v); }
      for (const c of children.flat()) if (c !== null && c !== undefined && c !== false) node.append(c instanceof Node ? c : String(c));
      return node;
    };
    const euros = (cents) => (cents / 100).toLocaleString("fr-FR", { style: "currency", currency: "EUR" });
    const ago = (at) => { const min = Math.round((Date.now() - at) / 60000); return min < 1 ? "à l'instant" : min < 60 ? `il y a ${min} min` : `il y a ${Math.round(min / 60)} h`; };
    /** Un choix renvoyé au bot de la personne (lu par son extension). L'appli se ferme ensuite. */
    const send = (action) => {
      // Ouvert depuis un bouton du CLAVIER (seul cas où Telegram transmet le choix au bot) : initData y est vide, la plateforme, elle, est connue.
      if (tg && typeof tg.sendData === "function" && tg.platform && tg.platform !== "unknown") { tg.HapticFeedback && tg.HapticFeedback.impactOccurred("medium"); tg.sendData(JSON.stringify(action)); }
      else alert("Ouvre « Mon tableau » depuis le bouton en bas de ta conversation avec ton bot : c'est lui qui transmet ton choix.");
    };
    const open = (url) => { if (/^https:\/\//.test(url)) { if (tg) tg.openLink(url); else window.open(url, "_blank", "noopener"); } };

    async function decode(hash) {
      const raw = new URLSearchParams(hash.replace(/^#/, "")).get("d");
      if (!raw) return null;
      const b64 = raw.slice(2).replace(/-/g, "+").replace(/_/g, "/");
      const bytes = Uint8Array.from(atob(b64 + "===".slice((b64.length + 3) % 4)), (c) => c.charCodeAt(0));
      let text;
      if (raw.startsWith("z.")) {
        if (typeof DecompressionStream === "undefined") throw new Error("Mets Telegram à jour pour voir ton tableau.");
        text = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text();
      } else text = new TextDecoder().decode(bytes);
      return JSON.parse(text);
    }

    function render(d) {
      const age = Date.now() - d.at;
      const reqs = (d.p || []).filter((r) => r.e > Date.now());
      app.replaceChildren(...[
        el("header", {}, el("div", { class: "logo" }, "⚡"), el("div", {}, el("h1", {}, "Mon tableau"), el("div", { class: "sub" }, `${d.n ? d.n + " · " : ""}mis à jour ${ago(d.at)}`))),
        age > 30 * 60000 ? el("p", { class: "old" }, "Tableau d'il y a plus de 30 min : envoie /tableau à ton bot pour le rafraîchir.") : null,
        el("div", { class: "chips" },
          el("span", { class: `chip ${d.on ? "ok" : "warn"}` }, d.on ? "● Surveillance active" : "⏸ Surveillance en pause"),
          d.v === true ? el("span", { class: "chip ok" }, "🔓 Coffre ouvert") : d.v === false ? el("span", { class: "chip warn" }, "🔒 Coffre fermé") : null,
          (d.b || 0) > 0 ? el("span", { class: "chip no" }, `⛔ ${d.b} marchand${d.b > 1 ? "s" : ""} bloqué${d.b > 1 ? "s" : ""}`) : null),
        reqs.length > 0 ? el("h2", {}, `🛒 Demandes d'achat (${reqs.length})`) : null,
        ...reqs.map((r) => el("div", { class: "card req" },
          el("div", { class: "title" }, r.t),
          el("div", { class: "meta" }, `${r.m}${r.pr ? " · " + r.pr : ""} · réponds dans ${Math.max(1, Math.round((r.e - Date.now()) / 60000))} min`),
          el("div", { class: "row" },
            el("button", { class: "buy", onclick: () => send({ a: "buy", id: r.i }) }, "✅ Acheter"),
            el("button", { class: "no", onclick: () => send({ a: "refuse", id: r.i }) }, "❌ Refuser")))),
        el("h2", {}, "🔥 Achetable maintenant à ton prix"),
        (d.o || []).length === 0 ? el("div", { class: "card empty" }, "Rien en stock dans ton budget pour l'instant.") : null,
        ...(d.o || []).map((o) => el("div", { class: "card" }, el("a", { class: "offer", href: "#", onclick: (e) => { e.preventDefault(); open(o.u); } },
          o.img ? el("img", { src: o.img, alt: "", loading: "lazy", referrerpolicy: "no-referrer" }) : el("div", { class: "ph" }, "🎴"),
          el("div", {}, el("div", { class: "t" }, o.t), el("div", { class: "p" }, euros(o.c), o.pre ? el("span", { class: "pre" }, "PRÉCOMMANDE") : null),
            el("div", { class: "m" }, `${o.m}${o.k > 1 ? ` · ${o.k} offres` : ""}`))))),
        el("h2", {}, "📦 Mes suivis"),
        el("div", { class: "card stats" },
          el("div", { class: "stat" }, el("b", {}, d.s ? d.s.f : 0), el("span", {}, "suivis")),
          el("div", { class: "stat" }, el("b", {}, d.s ? d.s.i : 0), el("span", {}, "en stock")),
          el("div", { class: "stat" }, el("b", {}, (d.o || []).length), el("span", {}, "à ton prix"))),
      ].filter((node) => node !== null));
      const pause = document.getElementById("pause");
      pause.textContent = d.on ? "⏸ Mettre la surveillance en pause" : "▶ Reprendre la surveillance";
      pause.onclick = () => send({ a: d.on ? "pause" : "resume" });
      document.getElementById("foot").hidden = false;
    }

    decode(location.hash).then((d) => {
      if (d === null) app.replaceChildren(el("p", { class: "empty" }, "Ouvre « Mon tableau » depuis le bouton en bas de ta conversation avec ton bot Pokemon Drop Assistant."));
      else render(d);
    }).catch((e) => app.replaceChildren(el("p", { class: "empty" }, `Tableau illisible : ${e.message}`)));
  </script>
</body>
</html>
