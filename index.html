<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pokemon Drop Assistant</title>
  <!--
    MINI APP TELEGRAM de Pokemon Drop Assistant (2026-10-20, v2). Page FIXE, sans serveur et sans aucune donnée : l'extension de chaque personne met son tableau (demandes
    d'achat, offres achetables à son prix, suivis, sorties, réglages) dans le LIEN du bouton « Mon tableau » (partie après #, qui ne quitte jamais le téléphone : elle n'est
    envoyée à aucun serveur). Les choix repartent au bot de la personne par Telegram (sendData), que son extension lit. La phrase du coffre est CHIFFRÉE ici pour l'extension
    seule (ECDH P-256 + AES-GCM) : Telegram ne voit qu'un texte illisible. Aucun jeton, aucun appel réseau à part le script officiel de Telegram et les photos des produits.
  -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff); --text: var(--tg-theme-text-color, #16181d); --hint: var(--tg-theme-hint-color, #7a808c);
      --card: var(--tg-theme-secondary-bg-color, #f1f2f5); --link: var(--tg-theme-link-color, #2a7de1); --btn: var(--tg-theme-button-color, #2a7de1);
      --btn-text: var(--tg-theme-button-text-color, #ffffff); --line: color-mix(in srgb, var(--hint) 22%, transparent);
      --ok: #1f9d55; --no: #d64545; --warn: #d4860b; --info: #2a7de1; --mute: #8a909c;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
    main { padding: 0 14px 96px; max-width: 640px; margin: 0 auto; }
    header { display: flex; align-items: center; gap: 11px; padding: 14px 0 10px; }
    .logo { width: 40px; height: 40px; border-radius: 13px; background: linear-gradient(135deg, #ffcb05, #e3350d); display: grid; place-items: center; font-size: 21px; flex: none; box-shadow: 0 2px 8px #e3350d33; }
    header h1 { font-size: 18px; margin: 0; letter-spacing: -.01em; }
    header .sub { font-size: 12px; color: var(--hint); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
    .chip { font-size: 12px; font-weight: 650; padding: 5px 10px; border-radius: 999px; background: var(--card); border: 0; color: var(--text); font-family: inherit; }
    .chip.ok { color: var(--ok); } .chip.warn { color: var(--warn); } .chip.no { color: var(--no); }
    button.chip { cursor: pointer; } button.chip.warn { background: color-mix(in srgb, var(--warn) 14%, var(--card)); }
    .tabs { position: sticky; top: 0; z-index: 5; background: var(--bg); display: flex; gap: 4px; padding: 6px 0 10px; }
    .tabs button { flex: 1; font: inherit; font-size: 14px; font-weight: 650; padding: 9px 6px; border: 0; border-radius: 11px; background: var(--card); color: var(--hint); cursor: pointer; position: relative; }
    .tabs.five button { font-size: 12.5px; padding: 9px 2px; }
    .tabs.six button { font-size: 11.5px; padding: 9px 1px; }
    .tabs.six .dot { top: 2px; right: 1px; min-width: 14px; height: 14px; line-height: 14px; font-size: 9px; padding: 0 3px; }
    .health-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .hcell { margin: 0; padding: 10px 12px; }
    .hcell .hlabel { font-weight: 700; margin-bottom: 2px; }
    .hcell.no { border-color: var(--no); } .hcell.warn { border-color: var(--warn); }
    .mbar { display: flex; gap: 3px; margin: 0 4px 10px; height: 22px; }
    .mseg { display: grid; place-items: center; border-radius: 6px; font-size: 11px; font-weight: 700; color: #fff; min-width: 22px; }
    .mseg.ok { background: var(--ok); } .mseg.warn { background: var(--warn); } .mseg.no { background: var(--no); } .mseg.mute { background: var(--mute); }
    .tabs.five .dot { top: 2px; right: 2px; min-width: 14px; height: 14px; line-height: 14px; font-size: 9px; padding: 0 3px; }
    .friend { display: flex; gap: 10px; align-items: flex-start; padding: 11px 2px; border-bottom: 1px solid var(--line); } .friend:last-child { border-bottom: 0; }
    .friend .dot { font-size: 15px; line-height: 1.4; } .friend .grow span { display: block; font-size: 12.5px; color: var(--hint); }
    .mfig { margin: 10px 0 4px; } .mchart { display: block; width: 100%; height: auto; }
    .mchart .mbar { fill: var(--btn); } .mchart .mhit { fill: transparent; } .mchart .mhit:active, .mchart .mhit:hover { fill: var(--text); opacity: .08; }
    .mchart .mbase { stroke: var(--line); stroke-width: 1; } .mchart .maxis { fill: var(--hint); font-size: 9px; }
    .tabs button.on { background: var(--btn); color: var(--btn-text); }
    button.picked { outline: 3px solid var(--text); outline-offset: -3px; font-weight: 700; }
    .tabs .dot { position: absolute; top: 5px; right: 8px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--no); color: #fff; font-size: 10px; line-height: 16px; padding: 0 4px; }
    h2 { font-size: 12.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--hint); margin: 18px 4px 8px; display: flex; justify-content: space-between; align-items: baseline; }
    h2 small { text-transform: none; letter-spacing: 0; font-weight: 500; }
    .card { background: var(--card); border-radius: 15px; padding: 12px; margin-bottom: 9px; }
    .req { border: 2px solid color-mix(in srgb, var(--ok) 45%, transparent); }
    .req .title { font-weight: 700; margin-bottom: 2px; }
    .req .meta { color: var(--hint); font-size: 13px; margin-bottom: 10px; }
    .row { display: flex; gap: 8px; align-items: center; }
    button.big { font: inherit; font-weight: 700; border: 0; border-radius: 12px; padding: 11px 12px; flex: 1; cursor: pointer; }
    button.buy { background: var(--ok); color: #fff; } button.no { background: transparent; color: var(--no); border: 2px solid var(--no); }
    button.ghost { background: var(--card); color: var(--text); } button.main { background: var(--btn); color: var(--btn-text); }
    button.small { font: inherit; font-size: 13px; font-weight: 700; border: 0; border-radius: 10px; padding: 7px 11px; cursor: pointer; white-space: nowrap; }
    .item { display: flex; gap: 12px; align-items: center; }
    .thumb { width: 60px; height: 60px; border-radius: 11px; object-fit: contain; background: #fff; flex: none; }
    div.thumb { display: grid; place-items: center; font-size: 25px; background: color-mix(in srgb, var(--hint) 12%, var(--bg)); }
    .grow { flex: 1; min-width: 0; }
    .t { font-weight: 600; font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .p { font-weight: 800; font-size: 16px; margin-top: 2px; }
    .m { font-size: 12px; color: var(--hint); }
    a.m { color: var(--link); text-decoration: none; }
    .pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; margin-right: 6px; vertical-align: 1px; }
    .pill.I { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); } .pill.P { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
    .pill.S { background: color-mix(in srgb, var(--info) 16%, transparent); color: var(--info); } .pill.O, .pill.U { background: color-mix(in srgb, var(--mute) 16%, transparent); color: var(--mute); }
    .pill.R { background: color-mix(in srgb, var(--no) 14%, transparent); color: var(--no); }
    .empty { color: var(--hint); text-align: center; padding: 18px 8px; }
    .stats { display: flex; gap: 8px; }
    .stat { flex: 1; text-align: center; background: var(--card); border-radius: 15px; padding: 12px 6px; }
    .stat b { display: block; font-size: 23px; letter-spacing: -.02em; } .stat span { font-size: 12px; color: var(--hint); }
    .rel { display: flex; justify-content: space-between; gap: 10px; padding: 9px 2px; border-bottom: 1px solid var(--line); }
    .rel:last-child { border-bottom: 0; } .rel b { font-weight: 600; } .rel span { color: var(--hint); font-size: 13px; white-space: nowrap; }
    .filters { display: flex; gap: 6px; margin: 0 0 10px; overflow-x: auto; }
    .filters button { font: inherit; font-size: 13px; font-weight: 650; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--text); cursor: pointer; white-space: nowrap; }
    .filters button.on { background: var(--text); color: var(--bg); border-color: var(--text); }
    .follow .ctl { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
    .follow.off .item { opacity: .55; }
    .follow.dirty { outline: 2px solid var(--btn); }
    .max { display: flex; align-items: center; gap: 6px; flex: 1; font-size: 13px; color: var(--hint); }
    input.euro { width: 82px; font: inherit; font-size: 15px; font-weight: 700; padding: 6px 8px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); color: var(--text); text-align: right; }
    .switch { position: relative; width: 46px; height: 28px; flex: none; }
    .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
    .switch span { position: absolute; inset: 0; border-radius: 14px; background: color-mix(in srgb, var(--mute) 45%, transparent); transition: background .15s; cursor: pointer; }
    .switch span::after { content: ""; position: absolute; width: 22px; height: 22px; top: 3px; left: 3px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px #0003; transition: transform .15s; }
    .switch input:checked + span { background: var(--ok); } .switch input:checked + span::after { transform: translateX(18px); }
    .set { display: flex; align-items: center; gap: 12px; padding: 12px 2px; border-bottom: 1px solid var(--line); }
    .set:last-child { border-bottom: 0; } .set .grow b { display: block; font-weight: 600; } .set .grow span { font-size: 12.5px; color: var(--hint); }
    .card.list { padding: 2px 12px; }
    .foot { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--line); z-index: 6; }
    .foot .row { max-width: 640px; margin: 0 auto; }
    .old { color: var(--warn); font-size: 12.5px; text-align: center; margin: -4px 0 10px; }
    .sheet { position: fixed; inset: 0; background: #0007; display: grid; align-items: end; z-index: 9; }
    .sheet > div { background: var(--bg); border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); max-width: 640px; width: 100%; margin: 0 auto; }
    .sheet h3 { margin: 0 0 6px; font-size: 17px; } .sheet p { margin: 0 0 12px; color: var(--hint); font-size: 13px; }
    .sheet h3 { margin: 0 0 4px; } .sheet .offer { display: flex; align-items: center; gap: 10px; padding: 10px 2px; border-bottom: 1px solid var(--line); } .sheet .offer:last-child { border-bottom: 0; }
    .sheet .scroll { max-height: 60vh; overflow-y: auto; }
    .search { width: 100%; font: inherit; font-size: 15px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--text); margin: 0 0 8px; }
    .hist { display: flex; gap: 10px; padding: 9px 2px; border-bottom: 1px solid var(--line); } .hist:last-child { border-bottom: 0; } .hist .grow span { display: block; color: var(--hint); font-size: 12.5px; }
    .tap { cursor: pointer; }
    .sheet input { width: 100%; font: inherit; font-size: 16px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--text); margin-bottom: 12px; }
  </style>
</head>
<body>
  <main id="app"><p class="empty">Chargement…</p></main>
  <div class="foot" id="foot" hidden><div class="row" id="footRow"></div></div>
  <script>
    "use strict";
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) { tg.ready(); tg.expand(); }
    const app = document.getElementById("app");
    const el = (tag, attrs, ...children) => {
      const node = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs || {})) {
        if (v === null || v === undefined || v === false) continue;
        if (k === "class") node.className = v; else if (k.startsWith("on")) node.addEventListener(k.slice(2), v); else if (k === "checked" || k === "value") node[k] = v; else node.setAttribute(k, v);
      }
      for (const c of children.flat()) if (c !== null && c !== undefined && c !== false) node.append(c instanceof Node ? c : String(c));
      return node;
    };
    const euros = (cents) => (cents / 100).toLocaleString("fr-FR", { style: "currency", currency: "EUR" });
    const typed = (cents) => (cents / 100).toFixed(2).replace(".", ",").replace(",00", "");
    const ago = (at) => { const min = Math.round((Date.now() - at) / 60000); return min < 1 ? "à l'instant" : min < 60 ? `il y a ${min} min` : `il y a ${Math.round(min / 60)} h`; };
    const haptic = (kind) => { try { tg && tg.HapticFeedback && (kind === "select" ? tg.HapticFeedback.selectionChanged() : tg.HapticFeedback.impactOccurred(kind)); } catch (e) { /* sans vibreur */ } };
    // Ouvert depuis un bouton du CLAVIER (seul cas où Telegram transmet le choix au bot) : initData y est vide, la plateforme, elle, est connue.
    const canSend = () => !!(tg && typeof tg.sendData === "function" && tg.platform && tg.platform !== "unknown");
    /** Un choix renvoyé au bot de la personne (lu par son extension). L'appli se ferme ensuite. */
    const send = (action) => {
      if (!canSend()) { alert("Ouvre « Mon tableau » depuis le bouton en bas de ta conversation avec ton bot : c'est lui qui transmet ton choix."); return; }
      haptic("medium");
      tg.sendData(JSON.stringify(action));
    };
    const confirmThen = (text, then) => { if (tg && typeof tg.showConfirm === "function" && tg.platform !== "unknown") tg.showConfirm(text, (ok) => ok && then()); else if (confirm(text)) then(); };
    const open = (url) => { if (/^https:\/\//.test(url)) { if (tg) tg.openLink(url); else window.open(url, "_blank", "noopener"); } };
    const thumb = (src) => {
      const ph = () => el("div", { class: "thumb" }, "🎴");
      if (!src) return ph();
      // Une photo que le marchand refuse de montrer hors de son site : la vignette de remplacement.
      return el("img", { class: "thumb", src, alt: "", loading: "lazy", referrerpolicy: "no-referrer", onerror: (e) => e.target.replaceWith(ph()) });
    };
    // R : en stock mais au-dessus de ton budget (revendeur) ; U : pas relu récemment (lectures en échec), son dernier état n'est pas sûr (2026-10-22).
    const STATE = { I: "En stock", P: "Précommande", R: "Prix trop haut", S: "Bientôt", O: "Épuisé", U: "Pas relu" };
    const ALERTS = [["En stock", "retour en stock"], ["Précommande", "précommande ouverte"], ["Baisse de prix", "un produit suivi baisse"], ["Bientôt disponible", "fiche annoncée"], ["Épuisé", "plus en stock"], ["Blocage à résoudre", "captcha ou accès limité"]];
    const parseEuros = (text) => { const t = text.trim().replace(/\s|€/g, "").replace(",", "."); if (t === "") return null; const n = Number(t); return Number.isFinite(n) && n > 0 && n < 100000 ? Math.round(n * 100) : undefined; };

    async function decode(hash) {
      const raw = new URLSearchParams(hash.replace(/^#/, "")).get("d");
      if (!raw) return null;
      const b64 = raw.slice(2).replace(/-/g, "+").replace(/_/g, "/");
      const bytes = Uint8Array.from(atob(b64 + "===".slice((b64.length + 3) % 4)), (c) => c.charCodeAt(0));
      let text;
      if (raw.startsWith("z.")) {
        if (typeof DecompressionStream === "undefined") throw new Error("Mets Telegram à jour pour voir ton tableau.");
        text = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text();
      } else text = new TextDecoder().decode(bytes);
      return JSON.parse(text);
    }
    const b64u = (bytes) => btoa(String.fromCharCode(...bytes)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    const fromB64u = (text) => { const b = text.replace(/-/g, "+").replace(/_/g, "/"); return Uint8Array.from(atob(b + "===".slice((b.length + 3) % 4)), (c) => c.charCodeAt(0)); };
    /** La phrase du coffre chiffrée pour l'extension seule : clé jetable + clé publique de l'extension → clé commune → AES-GCM. */
    async function seal(key, passphrase) {
      const mine = await crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, true, ["deriveKey"]);
      const theirs = await crypto.subtle.importKey("raw", fromB64u(key.pub), { name: "ECDH", namedCurve: "P-256" }, false, []);
      const aes = await crypto.subtle.deriveKey({ name: "ECDH", public: theirs }, mine.privateKey, { name: "AES-GCM", length: 256 }, false, ["encrypt"]);
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const c = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, aes, new TextEncoder().encode(JSON.stringify({ p: passphrase, t: Date.now() }))));
      return { a: "unlock", k: key.id, e: b64u(new Uint8Array(await crypto.subtle.exportKey("raw", mine.publicKey))), iv: b64u(iv), c: b64u(c) };
    }

    // --- État de la page --------------------------------------------------------------------------------------------------------
    let d = null;
    let tab = "home";
    let filter = "all";
    /** Recherche et filtre par extension dans Suivis (2026-10-21). */
    let query = "";
    let ext = "";
    /** Les changements pas encore envoyés : un seul envoi pour tout (l'appli se ferme après un envoi). */
    // decide : demande → "buy" | "refuse" ; buyNow : offre → libellé (2026-10-22 : PANIER DE CHOIX, l'appli ne se ferme qu'à l'envoi).
    const changes = { follow: new Map(), max: new Map(), set: {}, want: new Map(), decide: new Map(), buyNow: new Map() };
    const changeCount = () => changes.follow.size + changes.max.size + Object.keys(changes.set).length + changes.want.size + changes.decide.size + changes.buyNow.size;
    /** Choisir (ou retirer, au 2e tap) une réponse à une demande. */
    const decide = (id, v) => {
      // Extension d'avant le panier (pas de « bk ») : la réponse part tout de suite, comme avant.
      if (!d.bk) { send({ a: v, id }); return; }
      if (changes.decide.get(id) === v) changes.decide.delete(id); else changes.decide.set(id, v);
      haptic("select"); render();
    };
    /** « ⚡ Acheter » : mis au panier (ou envoyé tout de suite à une extension d'avant le panier). */
    const pickBuyNow = (w, label) => { if (!d.bk) send({ a: "buyNow", w }); else { changes.buyNow.set(w, label); render(); } };
    const plain = (t) => (t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
    /** Une fenêtre du bas (fiche produit, blocages) ; un tap à côté la ferme. */
    const sheetOf = (...children) => {
      const sheet = el("div", { class: "sheet", onclick: (e) => { if (e.target === sheet) sheet.remove(); } }, el("div", {}, ...children, el("button", { class: "big ghost", style: "margin-top:12px;width:100%", onclick: () => sheet.remove() }, "Fermer")));
      document.body.append(sheet);
      return sheet;
    };
    /** La FICHE d'un produit suivi : toutes ses offres, la moins chère d'abord, avec « ⚡ Acheter » sur celles en stock (2026-10-21). */
    function productSheet(f) {
      const offers = f.os && f.os.length > 0 ? f.os : [[f.m, f.c === undefined ? null : f.c, f.st, null]];
      sheetOf(el("h3", {}, f.t), el("div", { class: "m" }, `${offers.length} offre${offers.length > 1 ? "s" : ""}${f.e ? ` · ${f.e}` : ""}`),
        el("div", { class: "scroll" }, ...offers.map(([m, c, st, w]) => el("div", { class: "offer" },
          el("div", { class: "grow" }, el("b", {}, m), el("div", { class: "m" }, el("span", { class: `pill ${st}` }, STATE[st] || "?"), c === null ? "" : euros(c))),
          w && (st === "I" || st === "P") && c !== null ? el("button", { class: `small buy${changes.buyNow.has(w) ? " picked" : ""}`, onclick: () => (changes.buyNow.has(w) ? (changes.buyNow.delete(w), render())
            : confirmThen(`Acheter « ${f.t} » à ${euros(c)} chez ${m} ? L'achat part avec ton prochain envoi (mêmes garde-fous qu'un ✅).`, () => pickBuyNow(w, f.t))) }, changes.buyNow.has(w) ? "⚡ choisi" : "⚡ Acheter") : null))),
        el("a", { class: "m", style: "display:block;margin-top:8px", href: "#", onclick: (e) => { e.preventDefault(); open(f.u); } }, "voir la page de l'offre la moins chère ›"));
    }
    /** Le détail des marchands bloqués (2026-10-21). */
    function blockedSheet() {
      sheetOf(el("h3", {}, "⛔ Marchands bloqués"), el("div", { class: "m" }, "L'extension ne les relit plus pour l'instant ; rien à faire, elle réessaie seule."),
        ...(d.bl || []).map((b) => el("div", { class: "offer" }, el("div", { class: "grow" }, el("b", {}, b.m), el("div", { class: "m" }, `${b.w}${b.u ? ` · reprise vers ${new Date(b.u).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })}` : ""}`)))));
    }
    const settingOf = (key) => (key in changes.set ? changes.set[key] : d.g ? d.g[key] : undefined);

    function unlockSheet() {
      const input = el("input", { type: "password", placeholder: "Phrase du coffre", autocomplete: "off", enterkeyhint: "send" });
      const go = async () => {
        if (input.value === "") return;
        try { send(await seal(d.k, input.value)); } catch (e) { alert(`Chiffrement impossible : ${e.message}`); }
      };
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
      const sheet = el("div", { class: "sheet", onclick: (e) => { if (e.target === sheet) sheet.remove(); } }, el("div", {},
        el("h3", {}, "🔓 Ouvrir le coffre"),
        el("p", {}, "Ta phrase est chiffrée ici, sur ton téléphone, pour ton extension seule : Telegram ne voit qu'un texte illisible. L'ordinateur doit être allumé."),
        input,
        el("div", { class: "row" }, el("button", { class: "big ghost", onclick: () => sheet.remove() }, "Annuler"), el("button", { class: "big main", onclick: go }, "Ouvrir"))));
      document.body.append(sheet);
      setTimeout(() => input.focus(), 50);
    }

    function header() {
      const reqs = (d.p || []).filter((r) => r.e > Date.now());

      const start = end - series.length * R.ms;

          list.length === 0 ? el("div", { class: "card empty" }, "Activité des marchands non transmise (lien trop long ou extension à mettre à jour).")
            : el("div", { class: "card list" }, ...list.map((mc) => el("div", { class: "friend tap", onclick: () => merchantSheet(mc) },
              el("span", { class: "dot" }, FRIEND_DOT[mc.t] || "⚪"),
              el("div", { class: "grow" }, el("b", {}, mc.n), el("span", {}, mc.s), el("span", {}, `${mc.rd} lue${mc.rd > 1 ? "s" : ""} aujourd'hui`)))))];
      }
      const help = a.fr.reduce((n, f) => n + (f.hp || 0), 0);
      return [pick,
        el("div", { class: "stats" },
          el("div", { class: "stat" }, el("b", {}, a.fr.length), el("span", {}, "amis")),
          el("div", { class: "stat" }, el("b", {}, `${a.up}/${a.fr.length}`), el("span", {}, `sur la ${a.v}`)),
          el("div", { class: "stat" }, el("b", {}, a.fr.filter((f) => f.t === "b").length), el("span", {}, "à aider"))),
        help > 0 ? el("p", { class: "old" }, `🆘 ${help} demande${help > 1 ? "s" : ""} d'aide en attente (onglet Serveur du tableau de bord)`) : null,
        el("p", { class: "m", style: "margin:10px 4px" }, a.at ? `État lu ${ago(a.at)}. « Tester » demande à chaque extension de répondre : réponses dans ta conversation en 1 à 2 min.` : "État jamais lu : touche « Actualiser »."),
        el("div", { class: "row", style: "margin-bottom:10px" },
          el("button", { class: "big ghost", onclick: () => send({ a: "admin", do: "refresh" }) }, "🔄 Actualiser"),
          el("button", { class: "big main", onclick: () => send({ a: "admin", do: "test" }) }, "🧪 Tester tout le monde")),
        a.fr.length === 0 ? el("div", { class: "card empty" }, "Aucun ami ajouté (onglet Serveur du tableau de bord).") : el("div", { class: "card list" }, ...a.fr.map((f) => el("div", { class: "friend tap", onclick: () => friendSheet(f) },
          el("span", { class: "dot" }, FRIEND_DOT[f.t] || "⚪"),
          el("div", { class: "grow" }, el("b", {}, f.n), el("span", {}, f.s), el("span", {}, [f.seen ? `vu ${ago(f.seen)}` : "", f.ver ? `v${f.ver}` : ""].filter(Boolean).join(" · ")))))),
      ];
    }

    function footer() {
      const row = document.getElementById("footRow");
      const n = changeCount();
      if (n > 0) {
        const ops = [
          ...[...changes.follow].map(([w, on]) => ({ a: "follow", w, on })),
          ...[...changes.max].map(([w, c]) => ({ a: "max", w, c })),
          ...(Object.keys(changes.set).length > 0 ? [{ a: "set", ...changes.set }] : []),
          ...[...changes.want].map(([i, on]) => ({ a: "want", i, on })),
          ...[...changes.decide].map(([id, v]) => ({ a: v, id })),
          ...[...changes.buyNow.keys()].map((w) => ({ a: "buyNow", w })),
        ];
        const choices = changes.decide.size + changes.buyNow.size;
        row.replaceChildren(
          el("button", { class: "big ghost", style: "flex:0 0 auto", onclick: () => { changes.follow.clear(); changes.max.clear(); changes.set = {}; changes.want.clear(); changes.decide.clear(); changes.buyNow.clear(); render(); } }, "Annuler"),
          el("button", { class: "big main", onclick: () => send({ a: "batch", ops }) }, choices > 0 ? `📤 Envoyer ${n} choix` : `💾 Enregistrer ${n} changement${n > 1 ? "s" : ""}`));
      } else {
        row.replaceChildren(el("button", { class: "big ghost", onclick: () => send({ a: d.on ? "pause" : "resume" }) }, d.on ? "⏸ Mettre la surveillance en pause" : "▶ Reprendre la surveillance"));
      }
      document.getElementById("foot").hidden = false;
    }

    function render() {
      const body = tab === "follows" ? follows() : tab === "releases" ? releases() : tab === "state" ? stateView() : tab === "settings" ? settings() : tab === "admin" && d.ad ? admin() : home();
      app.replaceChildren(...[...header(), ...body].filter((node) => node !== null));
      footer();
    }

    decode(location.hash).then((data) => {
      if (data === null) { app.replaceChildren(el("p", { class: "empty" }, "Ouvre « Mon tableau » depuis le bouton en bas de ta conversation avec ton bot Pokemon Drop Assistant.")); return; }
      d = data;
      render();
    }).catch((e) => app.replaceChildren(el("p", { class: "empty" }, `Tableau illisible : ${e.message}`)));
  </script>
</body>
</html>
