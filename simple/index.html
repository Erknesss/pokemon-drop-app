<body>
  <main id="app"><p class="empty">Chargement…</p></main>
  <div class="foot" id="foot" hidden><div class="row" id="footRow"></div></div>
  <script>
    "use strict";
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) { tg.ready(); tg.expand(); }
    const app = document.getElementById("app");
    const el = (tag, attrs, ...children) => {
      const node = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs || {})) {
        if (v === null || v === undefined || v === false) continue;
        if (k === "class") node.className = v; else if (k.startsWith("on")) node.addEventListener(k.slice(2), v); else if (k === "checked" || k === "value") node[k] = v; else node.setAttribute(k, v);
      }
      for (const c of children.flat()) if (c !== null && c !== undefined && c !== false) node.append(c instanceof Node ? c : String(c));
      return node;
    };
    const euros = (cents) => (cents / 100).toLocaleString("fr-FR", { style: "currency", currency: "EUR" });
    const typed = (cents) => (cents / 100).toFixed(2).replace(".", ",").replace(",00", "");
    // Au-delà de 48 h : en jours (« il y a 4 j », pas « il y a 96 h »).
    const ago = (at) => { const min = Math.round((Date.now() - at) / 60000); return min < 1 ? "à l'instant" : min < 60 ? `il y a ${min} min` : min < 48 * 60 ? `il y a ${Math.round(min / 60)} h` : `il y a ${Math.round(min / 1440)} j`; };
    const haptic = (kind) => { try { tg && tg.HapticFeedback && (kind === "select" ? tg.HapticFeedback.selectionChanged() : tg.HapticFeedback.impactOccurred(kind)); } catch (e) { /* sans vibreur */ } };
    // Ouvert depuis un bouton du CLAVIER (seul cas où Telegram transmet le choix au bot) : initData y est vide, la plateforme, elle, est connue.
    const canSend = () => !!(tg && typeof tg.sendData === "function" && tg.platform && tg.platform !== "unknown");
    /** Un choix renvoyé au bot de la personne (lu par son extension). L'appli se ferme ensuite. */
    const send = (action) => {
      if (!canSend()) { alert("Ouvre « Mon tableau » depuis le bouton en bas de ta conversation avec ton bot : c'est lui qui transmet ton choix."); return; }
      haptic("medium");
      tg.sendData(JSON.stringify(action));
      // Envoyé depuis le bouton du clavier, Telegram ferme l'appli aussitôt. Si elle est encore là 2,5 s après, le choix n'est PAS parti (appli ouverte par le bouton de menu ou un lien) : on le dit.
      setTimeout(() => {
        const lost = "Ton choix n'est pas parti : l'appli n'est pas ouverte par le bon bouton. Ferme-la, puis rouvre-la avec le bouton « 📱 Mon tableau » en bas de ta conversation avec le bot (pas le bouton de menu).";
        if (typeof tg.showAlert === "function") tg.showAlert(lost); else alert(lost);
      }, 2500);
    };
    const confirmThen = (text, then) => { if (tg && typeof tg.showConfirm === "function" && tg.platform !== "unknown") tg.showConfirm(text, (ok) => ok && then()); else if (confirm(text)) then(); };
    const open = (url) => { if (/^https:\/\//.test(url)) { if (tg) tg.openLink(url); else window.open(url, "_blank", "noopener"); } };
    const thumb = (src) => {
      const ph = () => el("div", { class: "thumb" }, "🎴");
      if (!src) return ph();
      // Une photo que le marchand refuse de montrer hors de son site : la vignette de remplacement.
      return el("img", { class: "thumb", src, alt: "", loading: "lazy", referrerpolicy: "no-referrer", onerror: (e) => e.target.replaceWith(ph()) });
    };
    // R : en stock mais au-dessus de ton budget (revendeur) ; U : état pas sûr (pas relu depuis 20 min, lectures en échec, ou prix très sous le prix normal : peut-être une autre offre) (2026-11-10).
    const STATE = { I: "En stock", P: "Précommande", R: "Prix trop haut", S: "Bientôt", O: "Épuisé", U: "À vérifier" };
    const ALERTS = [["En stock", "retour en stock"], ["Précommande", "précommande ouverte"], ["Baisse de prix", "un produit suivi baisse"], ["Bientôt disponible", "fiche annoncée"], ["Épuisé", "plus en stock"], ["Blocage à résoudre", "captcha ou accès limité"]];
    const parseEuros = (text) => { const t = text.trim().replace(/\s|€/g, "").replace(",", "."); if (t === "") return null; const n = Number(t); return Number.isFinite(n) && n > 0 && n < 100000 ? Math.round(n * 100) : undefined; };

    async function decode(hash) {
      const raw = new URLSearchParams(hash.replace(/^#/, "")).get("d");
      if (!raw) return null;
      const b64 = raw.slice(2).replace(/-/g, "+").replace(/_/g, "/");
      const bytes = Uint8Array.from(atob(b64 + "===".slice((b64.length + 3) % 4)), (c) => c.charCodeAt(0));
      let text;
      if (raw.startsWith("z.")) {
        if (typeof DecompressionStream === "undefined") throw new Error("Mets Telegram à jour pour voir ton tableau.");
        text = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text();
      } else text = new TextDecoder().decode(bytes);
      return JSON.parse(text);
    }
    const b64u = (bytes) => btoa(String.fromCharCode(...bytes)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    const fromB64u = (text) => { const b = text.replace(/-/g, "+").replace(/_/g, "/"); return Uint8Array.from(atob(b + "===".slice((b.length + 3) % 4)), (c) => c.charCodeAt(0)); };
    /** La phrase du coffre chiffrée pour l'extension seule : clé jetable + clé publique de l'extension → clé commune → AES-GCM. */
    async function seal(key, passphrase) {
      const mine = await crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, true, ["deriveKey"]);
      const theirs = await crypto.subtle.importKey("raw", fromB64u(key.pub), { name: "ECDH", namedCurve: "P-256" }, false, []);
      const aes = await crypto.subtle.deriveKey({ name: "ECDH", public: theirs }, mine.privateKey, { name: "AES-GCM", length: 256 }, false, ["encrypt"]);
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const c = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, aes, new TextEncoder().encode(JSON.stringify({ p: passphrase, t: Date.now() }))));
      return { a: "unlock", k: key.id, e: b64u(new Uint8Array(await crypto.subtle.exportKey("raw", mine.publicKey))), iv: b64u(iv), c: b64u(c) };
    }

    // --- État de la page --------------------------------------------------------------------------------------------------------
    let d = null;
    let tab = "home";
    let filter = "all";
    /** Recherche et filtre par extension dans Suivis (2026-10-21). */
    let query = "";
    let ext = "";
    /** Les changements pas encore envoyés : un seul envoi pour tout (l'appli se ferme après un envoi). */
    // decide : demande → "buy" | "refuse" ; buyNow : offre → libellé (2026-10-22 : PANIER DE CHOIX, l'appli ne se ferme qu'à l'envoi).
    const changes = { follow: new Map(), max: new Map(), set: {}, want: new Map(), decide: new Map(), buyNow: new Map(), quick: new Map() };
    const changeCount = () => changes.follow.size + changes.max.size + Object.keys(changes.set).length + changes.want.size + changes.decide.size + changes.buyNow.size + changes.quick.size;
    /** Les changements du panier (réglages, suivis, sorties), dans l'ordre d'envoi. */
    const pendingOps = () => [
      ...[...changes.follow].map(([w, on]) => ({ a: "follow", w, on })),
      ...[...changes.max].map(([w, c]) => ({ a: "max", w, c })),
      ...(Object.keys(changes.set).length > 0 ? [{ a: "set", ...changes.set }] : []),
      ...[...changes.want].map(([i, on]) => ({ a: "want", i, on })),
    ];
    /**
     * UN ACHAT PART AU PREMIER GESTE (audit T7 du 2026-11-09 : « ✅ Acheter » ne faisait que choisir, il fallait encore « Envoyer 1 choix » ; fermer l'appli entre les deux perdait
     * l'achat). Le choix part tout de suite, avec ce qui attendait dans le panier (l'appli se ferme après un envoi : rien n'est perdu).
     */
    // « quick » n'existe que dans un envoi groupé (parseAppAction).
    // Toujours en envoi groupé, avec le jeton d'achat du lien (d.bt) : le PC refuse un achat sans lui (voir buyTokenValid).
    const sendNow = (op) => send({ a: "batch", ops: [...pendingOps(), op], ...(d.bt ? { t: d.bt } : {}) });
    /** Répondre à une demande d'achat : part tout de suite. */
    const decide = (id, v) => sendNow({ a: v, id });
    /** « ⚡ Acheter » une offre (après confirmation) : part tout de suite. */
    const pickBuyNow = (w) => sendNow({ a: "buyNow", w });
    const plain = (t) => (t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
    /** Une fenêtre du bas (fiche produit, blocages) ; un tap à côté la ferme. */
    const sheetOf = (...children) => {
      const sheet = el("div", { class: "sheet", onclick: (e) => { if (e.target === sheet) sheet.remove(); } }, el("div", {}, ...children, el("button", { class: "big ghost", style: "margin-top:12px;width:100%", onclick: () => sheet.remove() }, "Fermer")));
      document.body.append(sheet);
      return sheet;
    };
    /** La FICHE d'un produit suivi : toutes ses offres, la moins chère d'abord, avec « ⚡ Acheter » sur celles en stock (2026-10-21). */

            el("div", { class: "item tap", onclick: (e) => { if (e.target.tagName !== "A") productSheet(f); } }, thumb(f.img), el("div", { class: "grow" },
              el("div", { class: "t" }, f.t, f.os && f.os.length > 1 ? el("span", { class: "m" }, ` · ${f.os.length} offres ›`) : null),
              el("div", { class: "m" }, el("span", { class: `pill ${f.st}` }, STATE[f.st] || "?"), f.c ? `${euros(f.c)}${f.n ? ` (base ${euros(f.n)})` : ""} · ` : "", f.m),
              el("a", { class: "m", href: "#", onclick: (e) => { e.preventDefault(); open(f.u); } }, "voir la page ›"))),
            el("div", { class: "ctl" }, el("div", { class: "max" }, "Ton max", input, "€", max === null && f.l ? el("span", { class: "m" }, `auto : ${euros(f.l)}`) : null), toggle));
        }),
      ];
    }

    /** Le calendrier : les sorties groupées par mois (« novembre 2026 »), sans date à la fin (2026-11-02). */
    const monthGroups = (list) => {
      const groups = new Map();
      for (const r of [...list].sort((a, b) => (a.d ?? Infinity) - (b.d ?? Infinity))) {
        const label = r.d === null ? "Date pas encore connue" : new Date(r.d).toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
        groups.set(label, [...(groups.get(label) || []), r]);
      }
      return [...groups.entries()];
    };
    /** SORTIES (2026-10-21) : les prochaines sorties, « je la veux » d'un tap (ses produits suivis dès qu'ils apparaissent) ; envoyé avec « Enregistrer ». */
    function releases() {
      const list = d.rs || [];
      if (list.length === 0) return [el("div", { class: "card empty" }, d.rs ? "Aucune sortie à venir connue." : "Mets ton assistant à jour pour voir les sorties ici.")];
      const isOn = (r) => (changes.want.has(r.i) ? changes.want.get(r.i) : r.on);
      return [
        el("p", { class: "m", style: "margin:0 4px 8px" }, "Coche une sortie : ses produits seront suivis dès qu'ils apparaissent chez les marchands, et l'achat te sera proposé dans ton budget."),
        ...monthGroups(list).map(([label, rows]) => [el("h2", {}, label), el("div", { class: "card list" }, ...rows.map((r) => {
          const days = r.d === null ? null : Math.round((r.d - new Date().setHours(0, 0, 0, 0)) / 86400000);
          const toggle = el("label", { class: "switch" }, el("input", { type: "checkbox", checked: isOn(r), onchange: (e) => {
            haptic("light");
            if (e.target.checked === r.on) changes.want.delete(r.i); else changes.want.set(r.i, e.target.checked);
            render();
          } }), el("span", {}));
          return el("div", { class: "set" }, el("div", { class: "grow" }, el("b", {}, r.t),
            el("span", {}, r.d === null ? "date pas encore connue" : `${new Date(r.d).toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" })} · ${days <= 0 ? "aujourd'hui" : days === 1 ? "demain" : `dans ${days} j`}`)), toggle);
        }))]).flat(),
        (d.rn || []).length > 0 ? el("h2", {}, "📈 Réassorts par produit") : null,
        (d.rn || []).length > 0 ? el("div", { class: "card list" }, ...d.rn.map(([t, m, x]) => el("div", { class: "rel" }, el("div", { class: "grow" }, el("b", {}, t), el("span", {}, `${m} · ${x}`))))) : null,
        (d.rn || []).length > 0 ? el("p", { class: "m", style: "margin:6px 4px" }, "Ces fiches sont lues plus souvent le jour indiqué.") : null,
      ];
    }

    function settings() {
      if (!d.g) return [el("div", { class: "card empty" }, "Mets ton assistant à jour pour régler depuis ici.")];
      const change = (key, value) => { if (value === d.g[key]) delete changes.set[key]; else changes.set[key] = value; haptic("light"); render(); };
      const sw = (checked, onchange) => el("label", { class: "switch" }, el("input", { type: "checkbox", checked, onchange: (e) => onchange(e.target.checked) }), el("span", {}));
      const set = (title, hint, control) => el("div", { class: "set" }, el("div", { class: "grow" }, el("b", {}, title), el("span", {}, hint)), control);
      const mg = settingOf("mg");
      const margin = el("input", { class: "euro", inputmode: "numeric", value: mg < 0 ? "" : String(mg), placeholder: "%", "aria-label": "Marge en pourcent", disabled: mg < 0 ? "" : null });
      margin.addEventListener("change", () => {
        const n = Number(margin.value.replace("%", "").trim());
        if (!Number.isInteger(n) || n < 0 || n > 100) { alert("Marge : un nombre entier de 0 à 100."); margin.value = String(mg); return; }
        change("mg", n);
      });
      const al = settingOf("al");
      // « Acheter depuis l'appli » (2026-11-09) : absent = oui.
      const appBuy = "ap" in changes.set ? changes.set.ap : d.g.ap !== false;
      const view = simpleView() ? "simple" : "complete";
      return [
        el("h2", {}, "👁 Surveillance"),
        el("div", { class: "card list" },
          set("Surveillance des produits", d.on ? "Active : ton assistant lit tes produits suivis." : "En pause : plus rien n'est lu. Touche pour reprendre.",
            el("button", { class: `small ${d.on ? "ghost" : "main"}`, onclick: () => send({ a: d.on ? "pause" : "resume" }) }, d.on ? "⏸ Pause" : "▶ Reprendre"))),
        el("h2", {}, "🛒 Achat"),
        el("div", { class: "card list" },
          set("Achat automatique", "Après ton ✅, ton assistant passe la commande. Coupé : la page s'ouvre pour finir à la main.", sw(settingOf("ab"), (v) => change("ab", v))),
          set("Acheter depuis l'appli", "« ✅ Acheter » et « ⚡ Acheter » ici achètent, comme le ✅ du chat (3 au plus par 10 min). Coupé : seul le ✅ du chat achète.",
            sw(appBuy, (v) => { if (v === (d.g.ap !== false)) delete changes.set.ap; else changes.set.ap = v; haptic("light"); render(); })),
          set("Marge au-dessus du prix normal", mg < 0 ? "Coupée : ton max = le prix normal." : `Ton max = prix normal + ${mg} % (sauf « ton max » d'un produit).`,
            el("div", { class: "row" }, margin, sw(mg >= 0, (v) => change("mg", v ? (d.g.mg >= 0 ? d.g.mg : 10) : -1))))),
        el("h2", {}, "🔔 Alertes"),
        el("div", { class: "card list" },
          ...ALERTS.map(([title, hint], i) => set(title, hint, sw((al & (1 << i)) !== 0, (v) => change("al", v ? al | (1 << i) : al & ~(1 << i))))),
          set("Son spécial", "le carillon sur l'ordinateur", sw(settingOf("so"), (v) => change("so", v)))),
        el("h2", {}, "🖥 Affichage"),
        el("div", { class: "card list" },
          set("Affichage de l'appli", view === "simple" ? "Simple : 3 onglets (Accueil, Mes produits, Réglages)." : "Complet : tous les onglets (Suivis, Sorties, État…).",
            el("div", { class: "seg2" }, ...[["simple", "Simple"], ["complete", "Complet"]].map(([id, label]) => el("button", { class: view === id ? "on" : null, onclick: () => setViewMode(id) }, label))))),
        el("p", { class: "m", style: "margin:12px 4px" }, "Le reste (marchands, livraison, coffre, Discord) se règle dans le tableau de bord sur ton PC."),
      ];
    }

    /** AMIS (2026-10-21) : l'état de chaque ami, pour l'admin du serveur seulement (absent chez les amis), « Tester » et « Actualiser ». */
    const FRIEND_DOT = { o: "🟢", w: "🟠", b: "🔴", m: "⚪" };
    function friendSheet(f) {
      sheetOf(el("h3", {}, `${FRIEND_DOT[f.t]} ${f.n}`), el("div", { class: "m" }, f.n === f.i ? "" : `pseudo Discord : ${f.i}`),
        el("p", {}, f.s),
        el("div", { class: "m" }, [f.seen ? `extension vue ${ago(f.seen)}` : "extension jamais vue", f.ver ? `version ${f.ver}` : "version inconnue (« Tester » la donne)", f.hp ? `${f.hp} demande(s) d'aide` : ""].filter(Boolean).join(" · ")),
        el("button", { class: "big main", style: "margin-top:12px;width:100%", onclick: () => send({ a: "admin", do: "test", f: f.i }) }, `🧪 Tester ${f.n}`));
    }
    /** Une courbe d'activité (même dessin que le tableau de bord) : barres d'égale durée, la plus récente à droite, période et nombre au survol. */
    const SVGNS = "http://www.w3.org/2000/svg";
    const svgEl = (tag, attrs, text) => { const e = document.createElementNS(SVGNS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, String(v)); if (text !== undefined) e.textContent = text; return e; };
    const RANGES = { d: { ms: 30 * 60000, axis: ["il y a 24 h", "il y a 12 h", "maintenant"], per: "par demi-heure", span: "sur 24 h" },
      w: { ms: 4 * 3600000, axis: ["il y a 7 j", "il y a 3 j ½", "maintenant"], per: "par 4 h", span: "sur 7 jours" },
      m: { ms: 86400000, axis: ["il y a 30 j", "il y a 15 j", "aujourd'hui"], per: "par jour", span: "sur 30 jours" } };
    const hm = (ms) => new Date(ms).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
    const dd = (ms) => new Date(ms).toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" });
    function chart(title, series, range, unit) {
      const R = RANGES[range];
      const W = 320, H = 70, TOP = 12, BASE = H - 14;
      const max = Math.max(0, ...series), total = series.reduce((x, y) => x + y, 0);
      const now = Date.now();
      const end = range === "m" ? new Date(now).setHours(0, 0, 0, 0) + 86400000 : Math.floor(now / R.ms) * R.ms + R.ms;
      const start = end - series.length * R.ms;
      const box = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, class: "mchart" });
      const step = W / Math.max(1, series.length);
      box.append(svgEl("line", { x1: 0, x2: W, y1: BASE, y2: BASE, class: "mbase" }));
      series.forEach((n, i) => {
        const hgt = max === 0 ? 0 : Math.max(n > 0 ? 2 : 0, ((BASE - TOP) * n) / max);
        if (hgt > 0) box.append(svgEl("rect", { x: i * step + 0.5, y: BASE - hgt, width: Math.max(1, step - 1), height: hgt, rx: 1, class: "mbar" }));
        const from = start + i * R.ms;
        const hit = svgEl("rect", { x: i * step, y: 0, width: step, height: BASE, class: "mhit" });
        hit.append(svgEl("title", {}, `${range === "m" ? dd(from + R.ms / 2) : range === "w" ? `${dd(from)} ${hm(from)}–${hm(from + R.ms)}` : `${hm(from)}–${hm(from + R.ms)}`} : ${n} ${unit}${n > 1 ? "s" : ""}`));
        box.append(hit);
      });
      R.axis.forEach((label, i) => box.append(svgEl("text", { x: [0, W / 2, W][i], y: H - 2, "text-anchor": ["start", "middle", "end"][i], class: "maxis" }, label)));
      if (max > 0) box.append(svgEl("text", { x: 0, y: 9, class: "maxis" }, `max ${max} ${R.per}`));
      return el("div", { class: "mfig" }, el("div", { class: "m" }, `${title} — ${total} ${R.span}`), box);
    }
    /** La fiche d'un marchand : ses courbes (pages lues sur la période choisie, ses onglets sur 24 h) et la phrase de chaque onglet. */
    let mrange = "d";
    function merchantSheet(mc) {
      const sheet = sheetOf(el("div", { id: "msheet" }));
      const draw = () => {
        const host = sheet.querySelector("#msheet");
        const series = mc.r ? (mrange === "w" ? mc.r.w : mrange === "m" ? mc.r.m : mc.r.d) : undefined;
        host.replaceChildren(...[
          el("h3", {}, `${FRIEND_DOT[mc.t] || "⚪"} ${mc.n}`), el("p", {}, mc.s), el("div", { class: "m" }, `${mc.rd} page${mc.rd > 1 ? "s" : ""} lue${mc.rd > 1 ? "s" : ""} aujourd'hui`),
          el("div", { class: "filters", style: "margin-top:10px" }, ...[["d", "24 h"], ["w", "7 jours"], ["m", "1 mois"]].map(([id, label]) =>
            el("button", { class: mrange === id ? "on" : null, onclick: () => { mrange = id; haptic("select"); draw(); } }, label))),
          series ? chart("Pages lues", series, mrange, "page") : el("p", { class: "m" }, "Courbe non transmise (lien trop long) : ouvre le Diagnostic du tableau de bord."),
          mrange === "d" && mc.l ? chart("Onglet de lecture", mc.l, "d", "page") : null,
          mrange === "d" && mc.c ? chart("Onglet du compte", mc.c, "d", "page") : null,
          mc.tl ? el("p", { class: "m" }, `Onglet de lecture : ${mc.tl}`) : null,
          mc.tc ? el("p", { class: "m" }, `Onglet du compte : ${mc.tc}`) : null].filter((node) => node !== null));
      };
      draw();
    }
    let aview = "friends";
    /**
     * L'onglet ÉTAT (2026-10-22 : « l'extension en mobile ») : chaque rouage (surveillance, Discord, Telegram, coffre, comptes) et chaque marchand surveillé, en mots ; un tap
     * sur un marchand ouvre sa fiche (avec ses courbes chez l'admin).
     */
    function stateView() {
      const tone = { o: "ok", w: "warn", b: "no", m: "mute" };
      const list = (d.ms || []).slice().sort((a, b) => "bwmo".indexOf(a.t) - "bwmo".indexOf(b.t) || b.rd - a.rd);
      const counts = { o: 0, w: 0, b: 0, m: 0 };
      for (const m of list) counts[m.t] = (counts[m.t] || 0) + 1;
      const full = (n) => (d.ad && d.ad.mc ? d.ad.mc.find((x) => x.n === n) : null);
      return [
        el("h2", {}, "🩺 Tout est OK ?"),
        el("div", { class: "health-grid" }, ...(d.hc || []).map(([label, t, detail]) => el("div", { class: `card hcell ${tone[t] || "mute"}` },
          el("div", { class: "hlabel" }, `${t === "o" ? "✅" : t === "w" ? "⚠️" : t === "b" ? "⛔" : "➖"} ${label}`), el("div", { class: "m" }, detail)))),
        el("h2", {}, "🏬 Marchands", el("small", {}, `${list.length}`)),
        list.length === 0 ? el("div", { class: "card empty" }, "Mets ton assistant à jour pour voir l'état des marchands ici.") : null,
        // Les chiffres disent ce qu'ils comptent (audit T6 : « 1 » vert et « 1 » rouge sans légende).
        list.length === 0 ? null : el("div", { class: "mbar" }, ...["o", "w", "b", "m"].filter((k) => counts[k] > 0).map((k) => {
          const word = { o: "OK", w: "à surveiller", b: counts[k] > 1 ? "bloqués" : "bloqué", m: "inconnu" }[k];
          return el("span", { class: `mseg ${tone[k]}`, style: `flex:${Math.max(counts[k], 2)}`, title: `${counts[k]} ${word}` }, `${counts[k]} ${word}`);
        })),
        list.length === 0 ? null : el("div", { class: "card list" }, ...list.map((mc) => el("div", { class: "friend tap", onclick: () => merchantSheet(full(mc.n) || mc) },
          el("span", { class: "dot" }, FRIEND_DOT[mc.t] || "⚪"),
          el("div", { class: "grow" }, el("b", {}, mc.n), el("span", {}, mc.s), el("span", {}, `${mc.rd} page${mc.rd > 1 ? "s" : ""} lue${mc.rd > 1 ? "s" : ""} aujourd'hui`))))),
      ];
    }

    function admin() {
      const a = d.ad;
      const pick = el("div", { class: "filters" }, ...[["friends", `Amis (${a.fr.length})`], ["merchants", `Marchands (${(a.mc || []).length})`]].map(([id, label]) =>
        el("button", { class: aview === id ? "on" : null, onclick: () => { aview = id; haptic("select"); render(); } }, label)));
      if (aview === "merchants") {
        const list = a.mc || [];
        return [pick,
          el("p", { class: "m", style: "margin:0 4px 8px" }, "Lu sur ton PC dans ce que ton assistant a gardé : rien n'est relu chez les marchands. Touche un marchand pour ses courbes."),
          list.length === 0 ? el("div", { class: "card empty" }, "Activité des marchands non transmise (lien trop long ou assistant à mettre à jour).")
            : el("div", { class: "card list" }, ...list.map((mc) => el("div", { class: "friend tap", onclick: () => merchantSheet(mc) },
              el("span", { class: "dot" }, FRIEND_DOT[mc.t] || "⚪"),
              el("div", { class: "grow" }, el("b", {}, mc.n), el("span", {}, mc.s), el("span", {}, `${mc.rd} lue${mc.rd > 1 ? "s" : ""} aujourd'hui`)))))];
      }
      const help = a.fr.reduce((n, f) => n + (f.hp || 0), 0);
      return [pick,
        el("div", { class: "stats" },
          el("div", { class: "stat" }, el("b", {}, a.fr.length), el("span", {}, "amis")),
          el("div", { class: "stat" }, el("b", {}, `${a.up}/${a.fr.length}`), el("span", {}, `sur la ${a.v}`)),
          el("div", { class: "stat" }, el("b", {}, a.fr.filter((f) => f.t === "b").length), el("span", {}, "à aider"))),
        help > 0 ? el("p", { class: "old" }, `🆘 ${help} demande${help > 1 ? "s" : ""} d'aide en attente (onglet Serveur du tableau de bord)`) : null,
        el("p", { class: "m", style: "margin:10px 4px" }, a.at ? `État lu ${ago(a.at)}. « Tester » demande à chaque extension de répondre : réponses dans ta conversation en 1 à 2 min.` : "État jamais lu : touche « Actualiser »."),
        el("div", { class: "row", style: "margin-bottom:10px" },
          el("button", { class: "big ghost", onclick: () => send({ a: "admin", do: "refresh" }) }, "🔄 Actualiser"),
          el("button", { class: "big main", onclick: () => send({ a: "admin", do: "test" }) }, "🧪 Tester tous")),
        a.fr.length === 0 ? el("div", { class: "card empty" }, "Aucun ami ajouté (onglet Serveur du tableau de bord).") : el("div", { class: "card list" }, ...a.fr.map((f) => el("div", { class: "friend tap", onclick: () => friendSheet(f) },
          el("span", { class: "dot" }, FRIEND_DOT[f.t] || "⚪"),
          el("div", { class: "grow" }, el("b", {}, f.n), el("span", {}, f.s), el("span", {}, [f.seen ? `vu ${ago(f.seen)}` : "", f.ver ? `v${f.ver}` : ""].filter(Boolean).join(" · ")))))),
      ];
    }

    function footer() {
      const row = document.getElementById("footRow");
      const n = changeCount();
      // Les achats partent au premier geste : le panier ne garde plus que des réglages (suivis, ton max, sorties, réglages).
      if (n > 0) {
        row.replaceChildren(
          el("button", { class: "big ghost", style: "flex:0 0 auto", onclick: () => { changes.follow.clear(); changes.max.clear(); changes.set = {}; changes.want.clear(); changes.decide.clear(); changes.buyNow.clear(); changes.quick.clear(); render(); } }, "Annuler"),
          el("button", { class: "big main", onclick: () => send({ a: "batch", ops: pendingOps() }) }, `💾 Enregistrer ${n} changement${n > 1 ? "s" : ""}`));
      } else {
        row.replaceChildren();
      }
      document.getElementById("foot").hidden = n === 0;
      // Un changement pas encore enregistré : Telegram demande confirmation avant de fermer l'appli (audit T7).
      try { if (tg && tg.enableClosingConfirmation) { if (n > 0) tg.enableClosingConfirmation(); else tg.disableClosingConfirmation(); } } catch (e) { /* Telegram trop ancien : pas de confirmation */ }
    }

    function render() {
      // Affichage simple : « Mes produits » réunit suivis et sorties, « Réglages » réunit réglages, état et admin.
      const simple = simpleView();
      const body = tab === "follows" ? (simple ? [...follows(), el("h2", {}, "📅 Sorties"), ...releases()] : follows())
        : tab === "releases" ? releases() : tab === "state" ? stateView()
        : tab === "settings" ? (simple ? [...settings(), ...stateView(), ...(d.ad ? [el("h2", {}, "👑 Admin"), ...admin()] : [])] : settings())
        : tab === "admin" && d.ad ? admin() : home();
      app.replaceChildren(...[...header(), ...body].filter((node) => node !== null));
      footer();
    }

    decode(location.hash).then((data) => {
      if (data === null) { app.replaceChildren(el("p", { class: "empty" }, "Ouvre « Mon tableau » depuis le bouton en bas de ta conversation avec ton bot Pokemon Drop Assistant.")); return; }
      d = data;
      render();
    }).catch((e) => app.replaceChildren(el("p", { class: "empty" }, `Tableau illisible : ${e.message}`)));
  </script>
</body>
</html>
